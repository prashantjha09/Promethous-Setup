# One or many JVMs. The ServiceMonitor scrapes each ready pod of this Deployment.
# Prometheus does not scrape the Service ClusterIP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: lab
  labels:
    app: java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          # Built from java-app/Dockerfile and loaded into the cluster.
          # imagePullPolicy IfNotPresent uses that local image.
          image: java-app:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              # Above the 256 MiB heap so metaspace and threads still fit.
              memory: 512Mi
---
# Selects the Java pods. The ServiceMonitor reads this Service's endpoints,
# one pod IP per scrape, on port http and path /actuator/prometheus.
apiVersion: v1
kind: Service
metadata:
  name: java-app
  namespace: lab
  labels:
    app: java-app
spec:
  selector:
    app: java-app
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Selects every ready pod behind the java-app Service.
# Prometheus scrapes each pod IP, not the Service ClusterIP.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: java-app
  namespace: lab
  labels:
    app: java-app
    # kube-prometheus-stack only scrapes ServiceMonitors with its release label.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: java-app
  # Service label app=java-app becomes the Prometheus job label.
  jobLabel: app
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
